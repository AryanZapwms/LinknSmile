# nginx/ae.linknsmile.com.conf
#
# Template server block for the UAE deployment. Copy this onto the VPS
# yourself (e.g. /etc/nginx/conf.d/ae.linknsmile.com.conf or wherever
# CyberPanel/your nginx setup expects site configs) and reload nginx.
# This repo does not deploy this file automatically — it's a reference
# template, not live config.
#
# Proxies to the UAE PM2 instance ("linknsmile-ae") on port 3005 — see
# ecosystem.config.js and .github/workflows/deploy-ae.yml. India's own
# nginx/CyberPanel vhost (port 3004) is untouched by this file.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ae.linknsmile.com;

    # Required for certbot's HTTP-01 challenge before a cert exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────
# `listen ... ssl http2;` is the widely-compatible form (works on nginx
# < 1.25.1). If your nginx is >= 1.25.1, you can instead use
# `listen 443 ssl;` + a separate `http2 on;` line — either works.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ae.linknsmile.com;

    # Placeholders — fill in after running certbot yourself (see the
    # manual setup steps). Typical certbot/Let's Encrypt paths shown;
    # adjust if your CyberPanel/ACME client uses a different layout.
    # ssl_certificate     /etc/letsencrypt/live/ae.linknsmile.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ae.linknsmile.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    access_log /var/log/nginx/ae.linknsmile.com.access.log;
    error_log  /var/log/nginx/ae.linknsmile.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/HMR upgrade support (harmless in production, needed
        # if this config is ever reused for a non-prod preview).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Matches the same path Next.js's own health check hits internally
    # (see app/api/health/route.ts, scripts/deploy/lib/health-check.sh) —
    # left proxied normally, no special-casing needed.
    location /api/health {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        access_log off;
    }
}
